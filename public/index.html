<!DOCTYPE html>
<html>
<head>
    <title>Agusan National Science High School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/logo.png">
</head>
<body>

    <nav>
        <h2>ANSHS Portal</h2>

        <div>
            <a href="/">Home</a>
            <a href="/about.html">About</a>
            <a href="/news.html">News</a>
            <a href="/contact.html">Contact</a>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-left">

            <h1>
                Agusan National Science High School
            </h1>

            <p>
                Official School Portal
            </p>

        </div>

        <div class="login-card">

            <h3>Admin Login</h3>

            <input
                type="text"
                id="username"
                placeholder="Username">

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password">

            <br><br>

            <button onclick="login()">
                Login
            </button>

        </div>

    </section>

    <section class="latest-news">

        <h2>Latest News</h2>

        <div id="latestNews"></div>

    </section>

    <script>

        fetch("/api/news")
            .then(res => res.json())
            .then(data => {

                let html = "";

                data.forEach(item => {

                    html += `
                        <div class="card">
                            <h3>${item.title}</h3>
                            <p>${item.content}</p>
                        </div>
                    `;

                });

                document.getElementById("latestNews").innerHTML = html;

            });

        async function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const response =
                await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });

            const result =
                await response.json();

            if (result.success) {

                window.location =
                    "/admin.html";

            } else {

                alert(
                    "Invalid Username or Password"
                );

            }

        }

    </script>

</body>
</html>
